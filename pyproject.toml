[project]
name = "mdb"
version = "0.1.0"
description = "Machine Database - A Django app for managing computer equipment"
authors = [
    { name = "EDB", email = "edb@neuf.no" },
]
requires-python = "~=3.10"
license = "GPL-2.0-or-later"
dependencies = [
    "django>=4.0,<4.2",
    "django-auth-ldap==4.6.0",
    "django-extensions==3.2.3",
    "djangorestframework==3.15.1",
    "fabric>=2.7.1",
    "gunicorn>=23.0.0",
    "ipaddress>=1.0.23,<2.0.0",
    "mysqlclient>=2.0.3,<3.0.0",
    "sentry-sdk>=2.27.0",
]

[dependency-groups]
dev = [
    "fabric>=2.6.0,<3.0.0",
    "ruff>=0.11.9,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
