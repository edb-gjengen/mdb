[project]
name = "mdb"
version = "0.1.0"
description = "Machine Database - A Django app for managing computer equipment"
authors = [
    { name = "EDB", email = "edb@neuf.no" },
]
requires-python = ">=3.14"
license = "GPL-2.0-or-later"
dependencies = [
    "django>=6.0.3",
    "django-auth-ldap>=5.3.0",
    "django-extensions>=4.1",
    "djangorestframework>=3.17.0",
    "fabric>=3.2.2",
    "freezegun>=1.5.5",
    "gunicorn>=25.1.0",
    "ipaddress>=1.0.23,<2.0.0",
    "mysqlclient>=2.2.8,<3.0.0",
    "requests>=2.32.5",
    "sentry-sdk>=2.55.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-django>=4.12.0",
    "ruff>=0.15.6,<1.0.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mdbsite.settings"
python_files = ["tests/test_*.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
