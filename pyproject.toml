[project]
name = "mdb"
version = "0.1.0"
description = "Machine Database - A Django app for managing computer equipment"
authors = [
    { name = "EDB", email = "edb@neuf.no" },
]
requires-python = ">=3.14,<3.15"
license = "GPL-2.0-or-later"
dependencies = [
    "django>=6.1.2",
    "django-extensions>=4.1",
    "djangorestframework>=3.18.3",
    "gunicorn>=26.2.0",
    "requests>=2.34.2",
    "sentry-sdk>=2.73.0",
    "whitenoise>=6.12,<7",
]

[dependency-groups]
# Only needed on the server (LDAP is configured in production's settings).
# Kept separate so CI can skip building python-ldap from source.
prod = [
    "django-auth-ldap>=5.4.0",
]
dev = [
    "freezegun>=1.5.5",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.3,<1.0.0",
]

[tool.uv]
default-groups = ["dev", "prod"]

[tool.ruff]
exclude = ["mdb/migrations/**"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
]
ignore = [
    "E501",  # line-too-long
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mdbsite.settings"
python_files = ["tests/test_*.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
